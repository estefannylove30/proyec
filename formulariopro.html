<html>
<head>
  <title>Formulario</title>
</head>
<body background="ladrillos1.jpg">


  <h1 style="text-align:center; color:#754A42; padding-top:20px;">Formulario de Producción</h1>

  <div style="background-color:#fffde7; width:90%; max-width:600px; margin:20px auto; padding:20px; border-radius:10px; box-shadow:0px 0px 10px gray;">

    <form method="post">

      <p><label>📅 FECHA DE PRODUCCIÓN:</label><br>
      <input type="date" name="fecha" style="width:100%; padding:10px; border-radius:5px; border:1px solid #ccc;"></p>

      <p><label>🧱 CANTIDAD DE LADRILLOS:</label><br>
      <input type="number" name="cantidad de ladrillos" style="width:100%; padding:10px; border-radius:5px; border:1px solid #ccc;"></p>

      <p><label>♻️ TIPO DE PLÁSTICO:</label><br>
      <input type="text" name="TIPO" style="width:100%; padding:10px; border-radius:5px; border:1px solid #ccc;"></p>

      <p><label>🎨 COLOR DEL PLÁSTICO:</label><br>
      <input type="color" name="COLOR" style="width:100%; height:40px; border-radius:5px;"></p>

      <p><label>⚖️ PESO DE PLÁSTICO (KG):</label><br>
      <input type="number" name="PESO" style="width:100%; padding:10px; border-radius:5px; border:1px solid #ccc;"></p>

      <p><label>👤 RESPONSABLE:</label><br>
      <input type="text" name="RESPONSABLE" style="width:100%; padding:10px; border-radius:5px; border:1px solid #ccc;"></p>

      <p><label>💰 COSTO:</label><br>
      <input type="number" name="COSTO" style="width:100%; padding:10px; border-radius:5px; border:1px solid #ccc;"></p>

      <p style="text-align:center;">
        <input type="submit" value="ENVIAR" style="background-color:#754A42; color:white; padding:10px 25px; border:none; border-radius:5px; cursor:pointer;">
      </p>

    </form>

  </div>

</body>
</html>
